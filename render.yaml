services:
  - type: web
    name: stock-ocean-fish-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATA_PROVIDER
        value: auto
      - key: CLIENT_ORIGIN
        value: https://ammdna1206.github.io
      - key: UPSTREAM_TIMEOUT_MS
        value: "30000"
      - key: HISTORY_UPSTREAM_TIMEOUT_MS
        value: "6000"
      - key: HISTORY_FETCH_CONCURRENCY
        value: "4"
      - key: HISTORY_FETCH_DELAY_MS
        value: "0"
      - key: HISTORY_FETCH_RETRIES
        value: "1"
      - key: DB_PATH
        value: /tmp/market.sqlite
